name: Continuous Integration

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"

jobs:
  build-and-test:
    name: continuous-integration
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: "Set up Python"
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: "backend/uv.lock"

      - name: Run pre-commit hooks (optional)
        run: |
          uv pip install --system pre-commit
          pre-commit run --config .config/pre-commit-config.yaml --all-files
        continue-on-error: true

      - name: Install and sync dependencies
        run: |
          uv sync --project backend --locked --all-extras

      - name: Run backend tests
        run: |
          uv run --project backend pytest backend/tests --doctest-modules --cov=backend/app --cov-report=html

      - name: Upload Coverage Report
        uses: actions/upload-artifact@v4
        with:
          name: code-coverage-report
          path: htmlcov/
          if-no-files-found: warn
          retention-days: 7

  deploy:
    name: Deploy to GitHub Pages
    needs: [build-and-test]
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: "Set up Python"
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: "backend/uv.lock"

      - name: Install and sync dependencies
        run: |
          uv sync --project backend --group docs --locked

      - name: Configure Git Credentials
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com

      - name: Deploy documentation
        run: uv run --project backend mkdocs gh-deploy --config-file docs/mkdocs.yml --force
